version: "2"
agent:
  write: true
  branch:
    prefix: "claude/"
    prefix_all: true
  commit:
    author: "Claude Code <noreply@anthropic.com>"
permissions:
  allow:
    - Read(read)
    - Write(write)
    - Edit(edit)
  deny:
    - Bash(git push --force)
preferences:
  focusedMode: true
  maxTokens: 4000